<!DOCTYPE html>

<html>

<head>

    <title>Edit Student</title>

    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">

</head>

<body>

    <h2>Edit Student</h2>

    <form method="POST">

        <input type="text" name="name" value="{{ student[1] }}">

        <input type="number" name="age" value="{{ student[2] }}">

        <input type="text" name="gender" value="{{ student[3] }}">

        <input type="text" name="course" value="{{ student[4] }}">

        <input type="email" name="email" value="{{ student[5] }}">

        <input type="text" name="phone" value="{{ student[6] }}">

        <button>Update Student</button>

    </form>

    <br>

    <a href="/students">Back</a>

</body>

</html>
